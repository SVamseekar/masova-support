# Required status check name for branch protection: "test" (job name)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest pytest-asyncio httpx PyJWT flake8 black mypy pip-audit build

      - name: Repository hygiene
        run: |
          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" || true
          bash scripts/check-hygiene.sh

      - name: Format (Black)
        run: black --check src tests

      - name: Lint (flake8)
        run: flake8 src tests --show-source --statistics

      - name: Type check (mypy)
        run: mypy src

      - name: Production package build
        run: python -m build --wheel --outdir dist/

      - name: Verify package import
        run: python -c "import masova_agent"

      - name: Run unit tests (no live LLM/backend)
        env:
          GOOGLE_API_KEY: test-not-a-real-key
          LLM_API_KEY: test-not-a-real-key
          JWT_SECRET: test-secret-at-least-64-characters-long-for-hs512-aaaaaaaaaaaaaaaaaaaaaa
          AGENT_TRIGGER_API_KEY: test-trigger-key
          AGENT_TOKEN: test-agent-token
          BACKEND_URL: http://127.0.0.1:9
        run: python -m pytest tests/ -q --tb=short

      - name: Dependency audit
        # google-adk 1.35 requires starlette<1.0; the listed CVEs are only fixed in starlette 1.x.
        # Revisit when leaving the ADK 1.28–1.35 line. Do not add ignores without a comment.
        run: >
          pip-audit -r requirements.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
